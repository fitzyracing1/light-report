name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * *'   # daily, so this repo's own runner light never goes stale
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
  light:
    # ask the live light-report runner to check this repo; it does not wait or change this job's light
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: queue a runner check
        run: |
          curl -fsS -X POST https://light-report-production.up.railway.app/runs \
            -H 'Content-Type: application/json' \
            -d '{"repo":"${{ github.repository }}"}' || echo "runner did not take the job (busy or rate limited)"
